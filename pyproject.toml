[project]
name = "sherlock-next-word"
version = "0.1.0"
description = "Next-Word Prediction on The Adventures of Sherlock Holmes with LSTM + Attention variants"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sanket Bhure" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
